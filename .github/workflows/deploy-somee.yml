name: Deploy to Somee

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish ASP.NET Core app
        run: |
          dotnet publish QuanLiKhoaHocTrucTuyen/QuanLiKhoaHocTrucTuyen.csproj -c Release -o ./publish

      - name: Inject Production Connection String
        shell: pwsh
        run: |
          $prodConfig = @{
            ConnectionStrings = @{
              DefaultConnection = "${{ secrets.PROD_CONNECTION_STRING }}"
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "./publish/appsettings.Production.json" -Value $prodConfig -Encoding UTF8

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SOMEE_FTP_SERVER }}
          username: ${{ secrets.SOMEE_FTP_USERNAME }}
          password: ${{ secrets.SOMEE_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /www.ltwnhom10.somee.com/
