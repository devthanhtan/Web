name: Deploy to Somee

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish ASP.NET Core app
        run: |
          dotnet publish QuanLiKhoaHocTrucTuyen/QuanLiKhoaHocTrucTuyen.csproj -c Release -o ./publish

      - name: Inject Production settings
        shell: pwsh
        env:
          PROD_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
          VNPAY_TMN_CODE: ${{ secrets.VNPAY_TMN_CODE }}
          VNPAY_HASH_SECRET: ${{ secrets.VNPAY_HASH_SECRET }}
          VNPAY_BASE_URL: ${{ vars.VNPAY_BASE_URL }}
          VNPAY_UPDATE_ORDER_ON_RETURN: ${{ vars.VNPAY_UPDATE_ORDER_ON_RETURN }}
        run: |
          $prodConfig = [ordered]@{
            ConnectionStrings = @{ DefaultConnection = $env:PROD_CONNECTION_STRING }
          }
          if ($env:VNPAY_TMN_CODE -and $env:VNPAY_HASH_SECRET) {
            $prodConfig.Vnpay = [ordered]@{
              TmnCode             = $env:VNPAY_TMN_CODE
              HashSecret          = $env:VNPAY_HASH_SECRET
              BaseUrl             = $(if ($env:VNPAY_BASE_URL) { $env:VNPAY_BASE_URL } else { "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html" })
              UseRealGateway      = $true
              UpdateOrderOnReturn = $env:VNPAY_UPDATE_ORDER_ON_RETURN -ne "false"
            }
          }
          $prodConfig | ConvertTo-Json -Depth 5 | Set-Content -Path "./publish/appsettings.Production.json" -Encoding UTF8

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SOMEE_FTP_SERVER }}
          username: ${{ secrets.SOMEE_FTP_USERNAME }}
          password: ${{ secrets.SOMEE_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /www.ltwnhom10.somee.com/
