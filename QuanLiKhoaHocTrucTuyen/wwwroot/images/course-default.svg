<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <defs>
    <linearGradient id="df-bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#002B5B"/>
      <stop offset="55%" stop-color="#0054A6"/>
      <stop offset="100%" stop-color="#0A3977"/>
    </linearGradient>
    <radialGradient id="df-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 190) scale(480)">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.44"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="df-orange" x1="0" y1="0" x2="280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <pattern id="df-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#df-bg)"/>
  <rect width="1280" height="720" fill="url(#df-grid)"/>
  <rect width="1280" height="720" fill="url(#df-glow)"/>

  <!-- Decorative Circles -->
  <circle cx="960" cy="360" r="240" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="10 8"/>
  <circle cx="960" cy="360" r="185" stroke="#FF6B00" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Left Content -->
  <rect x="76" y="76" width="332" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.32"/>
  <circle cx="102" cy="98" r="7" fill="#FF6B00"/>
  <text x="120" y="104" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" letter-spacing="0.8">HUIT LEARNING · CHÍNH THỨC</text>

  <text x="76" y="218" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="62" font-weight="800">HUIT Learning</text>
  <text x="76" y="286" fill="#FDBA74" font-family="Segoe UI, Inter, sans-serif" font-size="44" font-weight="800">Khóa Học Trực Tuyến</text>

  <text x="76" y="352" fill="#F1F5F9" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="500">Học Tập Số Thực Chiến · Lộ Trình Bài Bản</text>
  <text x="76" y="390" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="400">Video bài giảng chất lượng cao, Quiz đánh giá &amp; Chứng chỉ số QR</text>

  <g transform="translate(76, 438)">
    <rect x="0" y="0" width="126" height="42" rx="12" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.32"/>
    <text x="63" y="27" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">Video HD</text>

    <rect x="140" y="0" width="136" height="42" rx="12" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.32"/>
    <text x="208" y="27" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">Quiz Online</text>

    <rect x="290" y="0" width="154" height="42" rx="12" fill="#FF6B00" fill-opacity="0.38" stroke="#FDBA74" stroke-opacity="0.65"/>
    <text x="367" y="27" text-anchor="middle" fill="#FFF7ED" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">Chứng Chỉ QR</text>
  </g>

  <rect x="76" y="536" width="276" height="58" rx="16" fill="url(#df-orange)"/>
  <text x="214" y="572" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="800">Khám Phá Tri Thức Số</text>

  <!-- Right Column: HUIT Learning Emblem Card + Play Player + Verified Badge -->
  <g transform="translate(716, 146)">
    <rect width="468" height="316" rx="28" fill="#0F172A" fill-opacity="0.90" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="2"/>

    <!-- Academic Cap + Play Emblem -->
    <polygon points="234,54 342,102 234,150 126,102" fill="#FF6B00" stroke="#FDBA74" stroke-width="2"/>
    <path d="M170 124 V168 C170 188 198 204 234 204 C270 204 298 188 298 168 V124" fill="#0054A6" stroke="#7DD3FC" stroke-width="2"/>
    <line x1="334" y1="106" x2="334" y2="168" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
    <circle cx="334" cy="174" r="7" fill="#FDE047"/>

    <text x="234" y="252" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="28" font-weight="800">HUIT LEARNING</text>
    <text x="234" y="284" text-anchor="middle" fill="#7DD3FC" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="600" letter-spacing="1.2">DIGITAL ACADEMY &amp; E-LEARNING</text>
  </g>

  <!-- Verified Certificate Floating Chip -->
  <g transform="translate(768, 492)">
    <rect width="364" height="92" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="20" y="18" width="56" height="56" rx="14" fill="#0054A6"/>
    <path d="M36 46 L45 55 L62 37" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="43" fill="#0F172A" font-family="Segoe UI, Inter, sans-serif" font-size="18" font-weight="800">Chứng Nhận Hoàn Thành</text>
    <text x="92" y="67" fill="#EA580C" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">Xác thực mã QR trực tuyến 24/7</text>
  </g>
</svg>
