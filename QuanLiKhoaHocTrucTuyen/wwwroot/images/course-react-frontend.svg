<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <defs>
    <linearGradient id="fe-bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060F24"/>
      <stop offset="48%" stop-color="#0F2D5E"/>
      <stop offset="100%" stop-color="#0054A6"/>
    </linearGradient>
    <radialGradient id="fe-glow-1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(940 330) scale(360)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fe-glow-2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1030 440) scale(280)">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fe-poly" x1="860" y1="200" x2="1020" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#0054A6"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <pattern id="fe-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.2" fill="#FFFFFF" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#fe-bg)"/>
  <rect width="1280" height="720" fill="url(#fe-grid)"/>
  <rect width="1280" height="720" fill="url(#fe-glow-1)"/>
  <rect width="1280" height="720" fill="url(#fe-glow-2)"/>

  <!-- Left Content -->
  <rect x="76" y="76" width="346" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.45"/>
  <circle cx="102" cy="98" r="7" fill="#38BDF8"/>
  <text x="120" y="104" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" letter-spacing="0.8">HUIT LEARNING · MODERN WEB 3D</text>

  <text x="76" y="216" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="56" font-weight="800">Three.js 3D WebGL</text>
  <text x="76" y="286" fill="#38BDF8" font-family="Segoe UI, Inter, sans-serif" font-size="48" font-weight="800">&amp; View Transitions</text>

  <text x="76" y="352" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="500">Interactive 3D Scene · Motion UI · ES Modules</text>
  <text x="76" y="390" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="400">Tạo trải nghiệm Web 3D 60fps &amp; chuyển trang mượt thế hệ mới</text>

  <g transform="translate(76, 438)">
    <rect x="0" y="0" width="124" height="42" rx="12" fill="#0284C7" fill-opacity="0.45" stroke="#38BDF8" stroke-opacity="0.65"/>
    <text x="62" y="27" text-anchor="middle" fill="#E0F2FE" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">Three.js</text>

    <rect x="138" y="0" width="166" height="42" rx="12" fill="#EA580C" fill-opacity="0.42" stroke="#FB923C" stroke-opacity="0.65"/>
    <text x="221" y="27" text-anchor="middle" fill="#FFF7ED" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">View Transitions</text>

    <rect x="318" y="0" width="112" height="42" rx="12" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.32"/>
    <text x="374" y="27" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">60 FPS</text>
  </g>

  <rect x="76" y="536" width="286" height="58" rx="16" fill="#FF6B00"/>
  <text x="219" y="572" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="800">Kỹ Nghệ Frontend Hiện Đại</text>

  <!-- Right Column: 3D WebGL Canvas Showcase + Orbital Rings + Faceted Crystal -->
  <g transform="translate(672, 106)">
    <rect width="528" height="366" rx="24" fill="#0B132B" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5"/>

    <!-- Axis gizmo top-right -->
    <line x1="472" y1="54" x2="498" y2="54" stroke="#EF4444" stroke-width="2.5"/>
    <line x1="472" y1="54" x2="472" y2="28" stroke="#10B981" stroke-width="2.5"/>
    <line x1="472" y1="54" x2="454" y2="70" stroke="#38BDF8" stroke-width="2.5"/>
    <text x="28" y="42" fill="#7DD3FC" font-family="Consolas, monospace" font-size="14" font-weight="700">WebGLRenderer · PerspectiveCamera(45°)</text>

    <!-- Tilted Orbital Rings -->
    <ellipse cx="264" cy="196" rx="196" ry="66" transform="rotate(-18 264 196)" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="2"/>
    <ellipse cx="264" cy="196" rx="176" ry="56" transform="rotate(26 264 196)" stroke="#FB923C" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="10 6"/>

    <!-- Central Faceted 3D Icosahedron / Octahedron -->
    <polygon points="264,86 356,166 322,286 206,286 172,166" fill="url(#fe-poly)" fill-opacity="0.85" stroke="#E0F2FE" stroke-width="2"/>
    <polygon points="264,86 356,166 264,196" fill="#7DD3FC" fill-opacity="0.38"/>
    <polygon points="264,86 172,166 264,196" fill="#0284C7" fill-opacity="0.45"/>
    <polygon points="172,166 206,286 264,196" fill="#003B75" fill-opacity="0.65"/>
    <polygon points="356,166 322,286 264,196" fill="#EA580C" fill-opacity="0.52"/>
    <line x1="264" y1="86" x2="264" y2="196" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="172" y1="166" x2="356" y2="166" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.2"/>
    <line x1="264" y1="196" x2="206" y2="286" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <line x1="264" y1="196" x2="322" y2="286" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Orbiting Satellites -->
    <circle cx="84" cy="244" r="11" fill="#38BDF8"/>
    <circle cx="438" cy="142" r="13" fill="#FF6B00"/>
    <circle cx="394" cy="272" r="8" fill="#FDE047"/>
  </g>

  <!-- View Transitions API Card -->
  <g transform="translate(672, 494)">
    <rect width="528" height="118" rx="20" fill="#0F172A" fill-opacity="0.92" stroke="#FB923C" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="26" y="38" fill="#FDBA74" font-family="Consolas, monospace" font-size="15" font-weight="700">@view-transition { navigation: auto; }</text>
    <text x="26" y="68" fill="#E2E8F0" font-family="Consolas, monospace" font-size="14">document.startViewTransition(() =&gt; morphCard())</text>
    <rect x="26" y="84" width="164" height="20" rx="10" fill="#10B981" fill-opacity="0.2"/>
    <text x="108" y="98" text-anchor="middle" fill="#4ADE80" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">16.6ms Frame Budget</text>
    <rect x="204" y="84" width="214" height="20" rx="10" fill="#0284C7" fill-opacity="0.25"/>
    <text x="311" y="98" text-anchor="middle" fill="#7DD3FC" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">prefers-reduced-motion Safe</text>
  </g>
</svg>
