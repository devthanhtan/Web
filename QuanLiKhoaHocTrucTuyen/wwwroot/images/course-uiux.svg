    <rect x="10" y="12" width="164" height="308" rx="20" fill="#FFFFFF"/>
    <rect x="62" y="20" width="60" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="22" y="40" width="140" height="68" rx="12" fill="#0054A6"/>
    <rect x="34" y="56" width="84" height="12" rx="6" fill="#FFFFFF"/>
    <rect x="34" y="76" width="58" height="10" rx="5" fill="#FDBA74"/>

