    <text x="24" y="36" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700">DESIGN TOKENS · CONTRAST 7.4:1</text>
    <rect x="24" y="54" width="66" height="64" rx="12" fill="#0054A6"/>
    <text x="57" y="92" text-anchor="middle" fill="#FFFFFF" font-family="Consolas, monospace" font-size="11" font-weight="700">#0054A6</text>

    <rect x="102" y="54" width="66" height="64" rx="12" fill="#FF6B00"/>
    <text x="135" y="92" text-anchor="middle" fill="#FFFFFF" font-family="Consolas, monospace" font-size="11" font-weight="700">#FF6B00</text>

    <rect x="180" y="54" width="66" height="64" rx="12" fill="#0EA5E9"/>
    <text x="213" y="92" text-anchor="middle" fill="#FFFFFF" font-family="Consolas, monospace" font-size="11" font-weight="700">#0EA5E9</text>

    <rect x="258" y="54" width="58" height="64" rx="12" fill="#F8FAFC"/>
    <text x="287" y="92" text-anchor="middle" fill="#0F172A" font-family="Consolas, monospace" font-size="11" font-weight="700">4.5:1+</text>
