    <rect x="316" y="164" width="130" height="142" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="326" y="174" width="110" height="58" rx="8" fill="#E0F2FE"/>
    <rect x="326" y="244" width="82" height="12" rx="6" fill="#1E293B"/>
    <rect x="326" y="266" width="64" height="10" rx="5" fill="#0EA5E9"/>
  </g>

