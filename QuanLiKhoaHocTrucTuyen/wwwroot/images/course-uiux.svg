    <rect x="34" y="136" width="98" height="10" rx="5" fill="#0F172A"/>
    <rect x="34" y="154" width="70" height="10" rx="5" fill="#64748B"/>
    <rect x="34" y="174" width="54" height="12" rx="6" fill="#FF6B00"/>

    <rect x="22" y="210" width="140" height="52" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="92" y="241" text-anchor="middle" fill="#EA580C" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800">390px Mobile OK</text>

    <rect x="22" y="274" width="140" height="34" rx="10" fill="#FF6B00"/>
    <text x="92" y="296" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Đăng Ký Học Ngay</text>
