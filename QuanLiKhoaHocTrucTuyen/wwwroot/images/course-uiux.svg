    <rect x="24" y="164" width="130" height="142" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="34" y="174" width="110" height="58" rx="8" fill="#DBEAFE"/>
    <rect x="34" y="244" width="88" height="12" rx="6" fill="#1E293B"/>
    <rect x="34" y="266" width="64" height="10" rx="5" fill="#FF6B00"/>

    <rect x="170" y="164" width="130" height="142" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="180" y="174" width="110" height="58" rx="8" fill="#FFEDD5"/>
    <rect x="180" y="244" width="92" height="12" rx="6" fill="#1E293B"/>
