<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <defs>
    <linearGradient id="ux-bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081C3A"/>
      <stop offset="48%" stop-color="#0054A6"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="ux-orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 200) scale(420)">
      <stop offset="0%" stop-color="#FDBA74" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FDBA74" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ux-cta" x1="0" y1="0" x2="270" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="ux-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#FFFFFF" fill-opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#ux-bg)"/>
  <rect width="1280" height="720" fill="url(#ux-dots)"/>
  <rect width="1280" height="720" fill="url(#ux-orb)"/>

  <!-- Left Content -->
  <rect x="76" y="76" width="320" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.32"/>
  <circle cx="102" cy="98" r="7" fill="#FDBA74"/>
  <text x="120" y="104" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" letter-spacing="0.8">HUIT LEARNING · UI/UX DESIGN</text>

  <text x="76" y="216" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="58" font-weight="800">Responsive UI</text>
  <text x="76" y="286" fill="#FDE68A" font-family="Segoe UI, Inter, sans-serif" font-size="50" font-weight="800">&amp; Design Tokens</text>

  <text x="76" y="352" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="500">Bootstrap 5 · Hệ Thống Lưới · Chuẩn WCAG 2.2</text>
  <text x="76" y="390" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="400">Thiết kế giao diện sáng hiện đại cho Mobile, Tablet &amp; Desktop</text>

  <!-- Tags -->
  <g transform="translate(76, 438)">
    <rect x="0" y="0" width="132" height="42" rx="12" fill="#0F172A" fill-opacity="0.45" stroke="#38BDF8" stroke-opacity="0.6"/>
    <text x="66" y="27" text-anchor="middle" fill="#E0F2FE" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">Bootstrap 5.3</text>

    <rect x="146" y="0" width="136" height="42" rx="12" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="214" y="27" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">Mobile-First</text>

    <rect x="296" y="0" width="120" height="42" rx="12" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="356" y="27" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">WCAG AA</text>
  </g>

  <rect x="76" y="536" width="268" height="58" rx="16" fill="#FFFFFF"/>
  <text x="210" y="572" text-anchor="middle" fill="#0054A6" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="800">Đa Thiết Bị Mượt Mà</text>

